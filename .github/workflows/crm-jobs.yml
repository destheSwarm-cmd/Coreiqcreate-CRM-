name: CoreIQ CRM Scheduled Operations

on:
  schedule:
    # Daily run at 05:00 UTC (07:00 SAST)
    - cron: '0 5 * * *'
    # Weekly backup run every Sunday at 00:00 UTC (02:00 SAST)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  crm_maintenance:
    name: Execute Daily Maintenance & System Backup
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Maintenance Job
        run: |
          echo "Triggering CoreIQ daily maintenance job..."
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRM_JOBS_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.CRM_BASE_URL }}/api/v1/admin/jobs/daily"

      - name: Trigger Automated CRM Backup
        run: |
          echo "Triggering automated CRM snapshot backup..."
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRM_JOBS_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"type": "scheduled"}' \
            "${{ secrets.CRM_BASE_URL }}/api/v1/admin/jobs/backup"
